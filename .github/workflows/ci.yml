name: CI

# Lints and tests the app on every pull request and every push to main.
# The Supabase side (migrations + Edge Functions) is deployed by
# deploy-supabase.yml.

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # analysis_options.yaml includes flutter_lints; any finding fails the build.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  edge-functions:
    name: Type-check Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # supabase/config.toml: [edge_runtime] deno_version = 2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check
        run: deno check supabase/functions/*/index.ts
